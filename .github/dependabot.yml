version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: deps"
    commit-message:
      prefix: "chore(deps)"

    # Grouped by update type so a week of patch bumps arrives as one reviewable
    # PR rather than twenty. Majors stay separate — they need reading.
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
      minor-updates:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "area: ci"
    commit-message:
      prefix: "chore(actions)"
