# Automatically applied by actions/labeler.
#
# One entry per workspace project, named after the directory, so a renamed or
# added project is a visible one-line change here rather than a label that
# silently stops matching.

"app: serverless-web":
  - changed-files:
      - any-glob-to-any-file: "apps/serverless-web/**"

"app: cloud-react":
  - changed-files:
      - any-glob-to-any-file: "apps/cloud-react/**"

"pkg: serverless":
  - changed-files:
      - any-glob-to-any-file: "packages/serverless/**"

"area: config":
  - changed-files:
      - any-glob-to-any-file: "config/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "nx.json"

"area: deps":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "bun.lock"
          - "**/package.json"

"area: docs":
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
