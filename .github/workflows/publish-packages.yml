name: Publish packages

# Publishes this workspace's packages to GitHub Packages.
#
# Triggered by a tag shaped like `function-studio-v0.1.0`, so each package is
# released independently and the tag records exactly what shipped. The workflow
# refuses to publish when the tag and the package.json version disagree — a
# mismatch there produces a release nobody can reproduce from the repo.
on:
  push:
    tags:
      - 'function-studio-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under packages/
        required: true
        default: function-studio

permissions:
  contents: read
  # Required for publishing to GitHub Packages with GITHUB_TOKEN.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # setup-node is here only for the authenticated .npmrc it writes; the
      # build itself runs on bun.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@datadack'

      - name: Resolve package
        id: pkg
        run: |
          NAME="${{ github.event.inputs.package || 'function-studio' }}"
          DIR="packages/$NAME"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::$DIR/package.json not found. The package must live in this repository for this workflow to publish it."
            exit 1
          fi
          VERSION=$(node -p "require('./$DIR/package.json').version")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $DIR at $VERSION"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME##*-v}"
          if [ "$TAG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version ${{ steps.pkg.outputs.version }}"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Build
        env:
          NX_DAEMON: 'false'
          NX_TUI: 'false'
        run: bunx nx build @datadack/function-studio

      - name: Verify build output
        run: |
          cd "${{ steps.pkg.outputs.dir }}"
          for f in dist/index.js dist/index.cjs dist/index.d.ts dist/styles.css; do
            [ -s "$f" ] || { echo "::error::missing or empty $f"; exit 1; }
          done

      # npm rather than bun: `bun publish` does not yet honour the .npmrc auth
      # that setup-node writes for GitHub Packages.
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
