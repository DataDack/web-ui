name: CI

# Quality gates for the bun/Nx workspace. Every job installs from the committed
# lockfile, so a dependency that only resolves on someone's machine fails here.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nx runs one-shot in CI: no background daemon, no interactive TUI.
  NX_DAEMON: 'false'
  NX_TUI: 'false'

jobs:
  # Lint, types and formatting are independent of each other, so they run as one
  # matrix rather than three near-identical jobs. A failure names the check.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          # Package names are lowercase; a capitalised scope resolves on a
          # case-insensitive macOS filesystem and fails on Linux, so it passes
          # review locally and breaks CI and the image build. It has reappeared
          # from editor auto-imports several times, hence a hard gate.
          - { name: Package name case, run: 'bun run check:scope-case' }
          - { name: ESLint, run: 'bun run lint' }
          - { name: TypeScript, run: 'bun run typecheck' }
          - { name: Formatting, run: 'bun run format:check' }
          - { name: Tests, run: 'bun run test', soft: true }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        continue-on-error: ${{ matrix.check.soft || false }}
        run: ${{ matrix.check.run }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds every project in the workspace, so a break in the publishable
      # package is caught here and not at publish time.
      - name: Build workspace
        run: bun run build

      # Both consumers copy an app's dist/ into their image as views/:
      # serverless_faas takes apps/serverless-web, cloud-be-go takes
      # apps/cloud-react. If a build stops emitting index.html the image build
      # fails later with a confusing COPY error, so assert it here where the
      # cause is obvious.
      - name: Verify app bundles
        run: |
          status=0
          for app in serverless-web cloud-react; do
            dist="apps/${app}/dist"
            if [ ! -s "$dist/index.html" ]; then
              echo "::error::$dist/index.html missing or empty — the image build for this app will fail"
              status=1
              continue
            fi
            echo "${app}: $(find "$dist" -type f | wc -l) files"
          done
          exit "$status"
