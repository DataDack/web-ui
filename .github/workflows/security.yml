name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Weekly, so a CVE published against an unchanged dependency still surfaces.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the build on high and critical advisories only. Moderate and below
      # are reported but do not block, so a transitive dev-only advisory cannot
      # stop a release on its own.
      - name: Audit dependencies
        run: bun audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:javascript-typescript'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Scan the range actually pushed. On push, base==head (default_branch
          # vs HEAD) makes the action error out with "BASE == HEAD"; use the
          # before/after SHAs so a push scans only its new commits, and fall back
          # to a full scan when there is no prior commit (initial push).
          base: ${{ github.event.before || '' }}
          head: ${{ github.sha }}
          extra_args: --results=verified,unknown
